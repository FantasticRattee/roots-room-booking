[options]
; Folders: where Odoo looks for our modules and keeps its files.
; ================================= Folders ==================================
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; =============================== End Folders ================================

; Database connection: how Odoo logs in to PostgreSQL.
; =========================== Database Connection ============================
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; ========================= End Database Connection ==========================

; Database choice: which database Odoo may open, and whether it adds demo data.
; ============================= Database Choice ==============================
dbfilter = ^booking$
without_demo = all
; =========================== End Database Choice ============================
